<!doctype html>
<!-- Source for banner.png (1600 x 400). Edit the text, then re-export with: node export-banner.mjs -->
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#1E2430}
  #banner{width:1600px;height:400px;box-sizing:border-box;background:#1E2430;color:#EEE9E0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-family:'Public Sans',Helvetica,Arial,sans-serif}
  .label{margin:0;font:500 22px/1.4 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,233,224,.78)}
  h1{margin:22px 0 0;font:400 58px/1.08 Newsreader,Georgia,serif;letter-spacing:-.01em}
  h1 .caps{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.035em}
  /* The thread: 9 whole stitches, 9px dash, 6px gap = 129px */
  .thread{margin-top:26px;width:129px;height:3px;background:repeating-linear-gradient(90deg,#E3A53A 0 9px,transparent 9px 15px)}
  .sub{margin:22px 0 0;font-size:28px;color:#B9B4AB}
</style></head>
<body><div id="banner">
  <p class="label">Alizée Baudez</p>
  <h1>Every market meets a<span class="caps">different version</span>of you.</h1>
  <div class="thread"></div>
  <p class="sub">International SEO and GEO · Strasbourg · Français · English · Deutsch</p>
</div></body></html>
